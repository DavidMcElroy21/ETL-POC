# The whole stack: one application image plus stock upstream services.
#
# The application image contains PyAirbyte, dbt and Dagster together. Postgres
# and the SFTP server are daemons, so they are separate containers -- but there
# is no Airbyte platform here: no abctl, no Kubernetes, no Airbyte web UI.
# PyAirbyte runs the connectors as an embedded library, which is what keeps the
# application side down to a single image.
#
#   docker compose up -d --build      then open http://localhost:3000
#
# Core pipeline only, without the ingestion-exercise targets:
#   docker compose up -d --build postgres sftp app
#
# With no internet access at all, to prove nothing is downloaded at run time:
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
#
# Every image is pinned by digest. See docs/architecture.md for the reasoning.

name: etl-poc

services:
  # --------------------------------------------------------------------------
  # Postgres: raw landing schema, dbt target, and dbt test-failure audit tables.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      # Exposed so you can inspect the warehouse with any SQL client.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SFTP: serves the retail CSV files. Read-only mount, so a pipeline run can
  # never modify or delete the sample data it is reading.
  # --------------------------------------------------------------------------
  sftp:
    image: atmoz/sftp:alpine@sha256:12ebaa334737b66079a193ac964752ffb5cbe1b80fbfe61831122d487562b605
    # user:password:uid:gid:upload-directory
    command: "${SFTP_USER:-etl}:${SFTP_PASSWORD:-etl_local_password}:1001:1001:upload"
    volumes:
      - ./data/sftp/retail:/home/${SFTP_USER:-etl}/upload/retail:ro
    ports:
      - "${SFTP_PORT_HOST:-2223}:22"
    healthcheck:
      # No shell utilities to speak of in this image, so probe the SSH banner
      # directly rather than pretending a process check means the port is up.
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Alternative ingestion sources -- provided as targets to connect TO.
  #
  # These back options 4 and 5 in docs/local-ingestion-options.md. The services
  # are here and seeded; the code that reads from them deliberately is not. That
  # is the exercise: everything needed to build those connections offline is
  # installed in the image, and docs/local-ingestion-options.md lists the
  # libraries and the endpoints.
  #
  # Neither is needed for the main SFTP pipeline. Core stack only:
  #   docker compose up -d postgres sftp app
  # --------------------------------------------------------------------------

  # Option 4: S3-compatible object storage.
  #
  # The images come from bitnamilegacy, not from minio. MinIO withdrew
  # minio/minio and minio/mc from Docker Hub -- the repositories are gone, not
  # merely moved, and quay.io does not serve them either -- which broke every
  # pull of the previously pinned digests. Bitnami's archived namespace still
  # publishes the same software, and both images are pinned by digest here, so
  # the content is immutable whatever happens to the tag.
  #
  # These are unmaintained archives. That is acceptable for a fixture whose job
  # is to hold seven CSV files for an exercise; it would not be acceptable for
  # anything in the pipeline's own path.
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # The Bitnami image creates this on first start, so the bucket exists
      # before minio-init runs rather than only because it does.
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-etl-poc}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      # Web console, for looking at what actually landed in the bucket.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # The health endpoint rather than `mc ready local`: that relied on an
      # alias the official image preconfigured, which this one does not.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Creates the bucket and uploads the retail CSVs, then exits. Runs once per
  # `up`; re-uploading over an existing object is harmless.
  minio-init:
    image: bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/sftp/retail:/seed:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-etl-poc} &&
      mc cp --recursive /seed/ local/${S3_BUCKET:-etl-poc}/retail/ &&
      echo 'seeded s3://${S3_BUCKET:-etl-poc}/retail/' &&
      mc ls --recursive local/${S3_BUCKET:-etl-poc}/
      "
    restart: "no"

  # Option 5: CDC source. A separate database, with logical replication enabled.
  postgres-source:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    # wal_level=logical is what makes replication slots possible; it cannot be
    # changed without a restart, which is why it is set here rather than at
    # run time.
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    environment:
      POSTGRES_USER: ${CDC_SOURCE_USER:-cdc}
      POSTGRES_PASSWORD: ${CDC_SOURCE_PASSWORD:-cdc_local_password}
      POSTGRES_DB: ${CDC_SOURCE_DB:-shop}
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./postgres-source/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "${CDC_SOURCE_PORT_HOST:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CDC_SOURCE_USER:-cdc} -d ${CDC_SOURCE_DB:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # The pipeline: PyAirbyte + dbt + Dagster in one image.
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit, and it has to be. The Dockerfile also builds the two images
      # the Azure deployment needs, and `orchestrator` and `ingest` come after
      # this one -- so without a target, Docker would build the last stage in
      # the file and the local stack would quietly come up as the ingest image.
      target: runtime
    image: etl-poc/pipeline:local
    depends_on:
      postgres:
        condition: service_healthy
      sftp:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-retail}

      SFTP_HOST: sftp
      SFTP_PORT: "22"
      SFTP_USER: ${SFTP_USER:-etl}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-etl_local_password}
      SFTP_FOLDER_PATH: /upload/retail

      # Option 4: S3-compatible object storage.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-etl-poc}
      S3_PREFIX: retail/

      # Option 5: CDC source database.
      CDC_SOURCE_HOST: postgres-source
      CDC_SOURCE_PORT: "5432"
      CDC_SOURCE_USER: ${CDC_SOURCE_USER:-cdc}
      CDC_SOURCE_PASSWORD: ${CDC_SOURCE_PASSWORD:-cdc_local_password}
      CDC_SOURCE_DB: ${CDC_SOURCE_DB:-shop}

      # Option 3: local filesystem.
      LOCAL_FILES_PATH: /data/local
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    volumes:
      # Run history survives a restart. Not mounting the source tree: the image
      # is the unit of deployment, and a bind mount over /opt/etl would shadow
      # the dbt manifest baked in at build time.
      - dagster_home:/opt/dagster/home
      # Option 3: the same retail files, available on a plain mounted path so
      # the local-filesystem option has something to read without any transport
      # in the way. Read-only; adding a file on the host is visible immediately
      # with no rebuild.
      - ./data/sftp/retail:/data/local:ro
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_source_data:
  minio_data:
  dagster_home:
