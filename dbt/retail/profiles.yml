# Checked in deliberately. Every value comes from the environment, and the only
# credentials involved are the throwaway ones docker-compose.yml sets up for a
# local POC. Nothing here is a secret.
retail:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'etl') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'etl') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail') }}"
      schema: retail
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 2

    # Used only by `dbt parse` and `dbt deps` during the image build, where no
    # database exists yet. Parsing never opens a connection, so the values are
    # placeholders that simply have to be present and well-formed.
    build:
      type: postgres
      host: localhost
      port: 5432
      user: build
      password: build
      dbname: build
      schema: retail
      threads: 1
