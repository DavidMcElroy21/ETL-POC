name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No agent instruction files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # This repository is published for model testing. Assistant instruction
      # files would become part of the evaluation corpus and bias results, so
      # .gitignore expresses the intent and this job enforces it.
      - name: Check for agent instruction files
        run: python scripts/check_no_agent_files.py

  source-pin:
    name: Dockerfile source pin is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check compares source trees across commits.
          fetch-depth: 0
      # The image clones its source at a pinned commit rather than copying the
      # build context, so every download happens at build time. This fails if
      # that pin no longer matches the source on this branch.
      # Invoked through bash rather than executed directly: the exec bit is not
      # reliably preserved when committing from Windows, and a permission error
      # here would look like a pin failure.
      - name: Check GIT_COMMIT pin
        run: bash scripts/pin_source_commit.sh --check

  sample-data:
    name: Sample data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The generator asserts all thirteen defect counts against the numbers in
      # docs/data-quality.md before it exits, so a drifted generator fails here.
      - name: Regenerate and verify defect counts
        run: python scripts/generate_retail_data.py
      # And the committed files must match what the generator produces, so the
      # data in the repository is always the data the documentation describes.
      - name: Committed data matches the generator output
        run: git diff --exit-code -- data/

  azure-images:
    name: Azure images build and load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The two images the Container Apps deployment runs. They are separate
      # stages from the compose image, so nothing else in this workflow would
      # notice them breaking -- and the failure mode is a code location that
      # will not load, which only appears once it is deployed.
      - name: Build the orchestrator image
        run: |
          docker build --build-arg SOURCE_STAGE=local-source             --target orchestrator -t etl-poc-orchestrator:ci .

      - name: Build the ingest image
        run: |
          docker build --build-arg SOURCE_STAGE=local-source             --target ingest -t etl-poc-ingest:ci .

      # `dagster api grpc` is what the code-location container actually runs,
      # and it loads every definition eagerly -- which `dagster dev` does not.
      # A definition conflict shows up here and nowhere else.
      - name: Code location starts over gRPC
        run: |
          docker run --rm -d --name code -e POSTGRES_PASSWORD=ci             etl-poc-orchestrator:ci             dagster api grpc --host 0.0.0.0 --port 4000             --module-name pipeline.definitions
          for _ in $(seq 1 30); do
            if docker logs code 2>&1 | grep -q "Started Dagster code server"; then
              docker rm -f code >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs code
          docker rm -f code >/dev/null
          echo "::error::code server did not start"
          exit 1

      - name: Azure instance config is valid
        run: |
          docker run --rm -e DAGSTER_HOME=/opt/dagster/home -e POSTGRES_PASSWORD=ci             -e AZURE_RESOURCE_GROUP=rg -e ACA_RUN_JOB_NAME=job             -e AZURE_SUBSCRIPTION_ID=00000000-0000-0000-0000-000000000000             -e DAGSTER_PG_USERNAME=u -e DAGSTER_PG_HOST=h -e DAGSTER_PG_DB=dagster             -e AZURE_STORAGE_ACCOUNT=s -e AZURE_LOGS_CONTAINER=dagster             etl-poc-orchestrator:ci python -c "
          from dagster._core.instance.config import dagster_instance_config
          config, _ = dagster_instance_config('/opt/dagster/home')
          for key in ('storage', 'run_launcher', 'run_coordinator', 'compute_logs'):
              assert key in config, key
          print('ok')
          "

      - name: Ingest image carries no orchestrator dependencies
        run: |
          if docker run --rm --entrypoint python etl-poc-ingest:ci -c "import dagster" 2>/dev/null; then
            echo "::error::dagster leaked into the ingest image"
            exit 1
          fi
          docker run --rm --entrypoint python etl-poc-ingest:ci             -c "import airbyte, azure.identity, azure.storage.blob, dagster_pipes"

  bicep:
    name: Bicep templates compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the templates
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SOURCE_STAGE=local-source builds the working tree instead of the
      # pinned commit. CI is testing the code in this branch, which by
      # definition is not yet published for the default git-source stage to
      # fetch.
      - name: Build and start the stack
        run: docker compose build --build-arg SOURCE_STAGE=local-source app

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the application to become healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' etl-poc-app-1 2>/dev/null || echo starting)
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          echo "application did not become healthy in time"
          docker compose logs app
          exit 1

      - name: SFTP connectivity
        run: docker compose exec -T app /opt/venv/ingest/bin/python -m ingest.run_sftp_sync --check

      - name: Run the full pipeline
        run: docker compose exec -T app dagster job execute -m pipeline.definitions -j retail_pipeline

      # The core assertion: the pipeline succeeds, and it succeeds *with*
      # warnings. A run reporting zero warnings would mean the seeded defects
      # stopped being detected, which is a regression even though it looks green.
      - name: dbt build warns without failing
        run: |
          output=$(docker compose exec -T app dbt build \
            --project-dir /opt/etl/dbt/retail \
            --profiles-dir /opt/etl/dbt/retail 2>&1)
          echo "$output"
          echo "$output" | grep -qE "WARN=13 ERROR=0" \
            || { echo "::error::expected WARN=13 ERROR=0"; exit 1; }

      # And the inverse: with --warn-error the same findings must fail the run.
      # If this passes, the tests are not actually firing.
      - name: Warnings become errors under --warn-error
        run: |
          if docker compose exec -T app dbt build \
              --project-dir /opt/etl/dbt/retail \
              --profiles-dir /opt/etl/dbt/retail --warn-error; then
            echo "::error::--warn-error should have failed the build"
            exit 1
          fi

      - name: Marts are populated
        run: |
          docker compose exec -T postgres psql -U etl -d retail -tAc \
            "select count(*) from retail_marts.agg_daily_store_sales" \
            | grep -qE "^[1-9][0-9]*$" \
            || { echo "::error::agg_daily_store_sales is empty"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
