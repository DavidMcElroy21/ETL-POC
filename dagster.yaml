# Dagster instance configuration.
#
# Run, event and schedule storage all default to SQLite under DAGSTER_HOME,
# which is mounted as a named volume so history survives a container restart.
# That is the right trade for a POC: no extra service, no extra dependency.
#
# For anything beyond a demo, swap these for dagster-postgres and point them at
# the same database the pipeline writes to. See docs/architecture.md.

telemetry:
  enabled: false

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2

retention:
  schedule:
    purge_after_days: 7
  sensor:
    purge_after_days: 7
